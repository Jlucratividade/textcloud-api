
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextCloud | Dark</title>

<style>
:root {
  color-scheme: dark;
  --bg: #090d16;
  --panel: #111827;
  --panel2: #182235;
  --border: #273449;
  --text: #e5eaf3;
  --muted: #8995aa;
  --primary: #8b5cf6;
  --primary-hover: #7c3aed;
  --green: #22c55e;
  --red: #ef4444;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 16px;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #19203b 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, Arial, sans-serif;
}

.container {
  max-width: 760px;
  margin: 40px auto;
}

.header {
  margin-bottom: 25px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(135deg, #8b5cf6, #4f46e5);
  font-size: 23px;
}

h1 {
  margin: 0;
  font-size: 25px;
  letter-spacing: -.7px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.card {
  background: rgba(17, 24, 39, .94);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 20px 60px #0005;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
}

textarea, select, input {
  width: 100%;
  background: #0b1220;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 13px;
  font: inherit;
  outline: none;
  transition: .2s;
}

textarea:focus, select:focus, input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px #8b5cf622;
}

textarea {
  min-height: 240px;
  resize: vertical;
  line-height: 1.6;
  font-size: 14px;
}

select {
  cursor: pointer;
}

.field {
  margin-bottom: 20px;
}

.counter {
  text-align: right;
  color: var(--muted);
  font-size: 11px;
  margin-top: 6px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 650;
  font-size: 13px;
  transition: .2s;
}

button:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.primary {
  background: var(--primary);
  color: white;
}

.secondary {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
}

.danger {
  background: #45191f;
  color: #fca5a5;
  border: 1px solid #7f1d1d;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.status {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 9px;
  background: #182235;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.status.success {
  display: block;
  color: #86efac;
  background: #10251c;
  border-color: #166534;
}

.status.error {
  display: block;
  color: #fca5a5;
  background: #291419;
  border-color: #7f1d1d;
}

.result {
  display: none;
  margin-top: 24px;
  padding: 20px;
  background: #0b1220;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.result h3 {
  margin-top: 0;
  color: var(--green);
  font-size: 16px;
}

.result .field {
  margin-bottom: 17px;
}

.result input {
  font-size: 12px;
  color: #a5b4fc;
}

.copy {
  margin-top: 7px;
  background: #26334b;
  color: #c4b5fd;
  padding: 9px 13px;
}

.footer {
  text-align: center;
  margin-top: 20px;
  color: #657187;
  font-size: 11px;
}

@media(max-width: 500px) {
  body {
    padding: 12px;
  }

  .container {
    margin: 15px auto;
  }

  .card {
    padding: 17px;
  }

  .actions button {
    flex: 1;
  }

  textarea {
    min-height: 190px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <h1>TextCloud</h1>
        <div class="subtitle">
          Hospedagem simples e rápida de textos
        </div>
      </div>
    </div>
  </header>

  <main class="card">

    <div class="field">
      <label for="content">Conteúdo do texto</label>

      <textarea
        id="content"
        placeholder="Digite ou cole seu texto aqui..."
      ></textarea>

      <div class="counter">
        <span id="count">0</span> caracteres
      </div>
    </div>

    <div class="field">
      <label for="expiration">Tempo de expiração</label>

      <select id="expiration">
        <option value="10m">10 minutos</option>
        <option value="1h">1 hora</option>
        <option value="1d" selected>1 dia</option>
        <option value="1w">1 semana</option>
        <option value="1m">1 mês</option>
        <option value="never">Nunca (se suportado)</option>
      </select>
    </div>

    <div class="actions">
      <button class="primary" id="publish">
        ↑ Publicar texto
      </button>

      <button class="secondary" id="clear">
        Limpar
      </button>
    </div>

    <div id="status" class="status" role="status"></div>

    <section id="result" class="result">

      <h3>✓ Texto publicado</h3>

      <div class="field">
        <label>URL pública</label>
        <input id="publicUrl" readonly>
        <button class="copy" onclick="copyField('publicUrl')">
          Copiar URL
        </button>
      </div>

      <div class="field">
        <label>URL Raw (conteúdo puro)</label>
        <input id="rawUrl" readonly>
        <button class="copy" onclick="copyField('rawUrl')">
          Copiar Raw
        </button>
      </div>

      <hr style="border:0;border-top:1px solid var(--border);margin:20px 0">

      <button class="danger" id="delete">
        🗑 Excluir texto publicado
      </button>

    </section>

  </main>

  <footer class="footer">
    TextCloud · Powered by Vercel + Pastebin.ai
  </footer>

</div>

<script>
const API =
  'https://textcloud-api.vercel.app/api/pastes';

const $ = id => document.getElementById(id);

let currentPaste = null;

function setStatus(message, type = '') {
  const el = $('status');

  el.textContent = message;
  el.className = 'status ' + type;
}

function savePaste(data) {
  currentPaste = data;

  localStorage.setItem(
    'textcloud_paste',
    JSON.stringify(data)
  );
}

function showResult(data) {
  $('publicUrl').value = data.url || '';
  $('rawUrl').value = data.raw_url || '';

  $('result').style.display = 'block';
}

function loadPaste() {
  try {
    const data = localStorage.getItem('textcloud_paste');

    if (!data) return;

    currentPaste = JSON.parse(data);
    showResult(currentPaste);

    setStatus(
      'Publicação anterior recuperada.',
      'success'
    );

  } catch {
    localStorage.removeItem('textcloud_paste');
  }
}

async function publish() {
  const content = $('content').value.trim();

  if (!content) {
    setStatus('Digite algum texto antes de publicar.', 'error');
    return;
  }

  $('publish').disabled = true;

  setStatus('Publicando texto...');

  try {
    const response = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        content,
        language: 'plaintext',
        visibility: 'unlisted',
        expiration: $('expiration').value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || 'Erro HTTP ' + response.status
      );
    }

    if (!data.id || !data.delete_token) {
      throw new Error(
        'Resposta inválida da API.'
      );
    }

    const paste = {
      id: data.id,
      url: data.url,
      raw_url: data.raw_url,
      delete_token: data.delete_token
    };

    savePaste(paste);
    showResult(paste);

    setStatus('Texto publicado com sucesso!', 'success');

  } catch (error) {
    setStatus(
      'Erro ao publicar: ' + error.message,
      'error'
    );
  } finally {
    $('publish').disabled = false;
  }
}

async function deletePaste() {
  if (!currentPaste) return;

  if (!confirm('Deseja realmente excluir este texto?')) {
    return;
  }

  $('delete').disabled = true;

  setStatus('Excluindo texto...');

  try {
    const response = await fetch(
      API + '/' + encodeURIComponent(currentPaste.id),
      {
        method: 'DELETE',
        headers: {
          'X-Delete-Token': currentPaste.delete_token
        }
      }
    );

    if (!response.ok) {
      throw new Error('Erro HTTP ' + response.status);
    }

    localStorage.removeItem('textcloud_paste');

    currentPaste = null;

    $('result').style.display = 'none';

    setStatus('Texto excluído com sucesso!', 'success');

  } catch (error) {
    setStatus(
      'Erro ao excluir: ' + error.message,
      'error'
    );
  } finally {
    $('delete').disabled = false;
  }
}

async function copyField(id) {
  try {
    await navigator.clipboard.writeText($(id).value);

    setStatus('Link copiado para a área de transferência!', 'success');

  } catch {
    $(id).select();
    document.execCommand('copy');

    setStatus('Link copiado!', 'success');
  }
}

$('content').addEventListener('input', () => {
  $('count').textContent =
    $('content').value.length;
});

$('publish').addEventListener('click', publish);

$('delete').addEventListener('click', deletePaste);

$('clear').addEventListener('click', () => {
  $('content').value = '';
  $('count').textContent = '0';

  setStatus('Campo de texto limpo.', 'success');
});

loadPaste();
</script>

</body>
</html>
